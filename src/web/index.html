<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quaked</title>
<style>
:root {
  --bg: #f5f5f7; --panel: #ffffff; --panel-2: #f0f0f3; --line: #e2e2e7; --text: #1d1d1f;
  --muted: #6e6e73; --faint: #a1a1a6; --accent: #0a84ff; --green: #2f9e5b; --amber: #c98a00;
  --red: #e5484d; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114; --panel: #1b1b1f; --panel-2: #232328; --line: #2e2e35; --text: #ececf1;
    --muted: #9a9aa3; --faint: #65656e; --accent: #4c9dff; --green: #3fbf75; --amber: #f2b705;
    --red: #ff6b6b; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
nav { padding: 18px 12px; border-right: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; height: 100vh; }
nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 4px 8px 16px; }
nav .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); }
nav .brand .dot.on { background: var(--green); }
nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--text); text-decoration: none; cursor: pointer; user-select: none; }
nav a:hover { background: var(--panel-2); }
nav a.active { background: var(--accent); color: #fff; }
nav .where { margin-top: 18px; padding: 10px; border-radius: 10px; background: var(--panel-2); font-size: 12px; color: var(--muted); }
nav .where b { color: var(--text); display: block; font-size: 13px; }
main { padding: 26px 34px 60px; max-width: 980px; width: 100%; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 18px; }
.card > h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 14px 18px 4px; }
.card > .foot { color: var(--muted); font-size: 12px; padding: 0 18px 14px; }
.row { display: flex; align-items: center; gap: 14px; padding: 11px 18px; border-top: 1px solid var(--line); min-height: 48px; }
.card > h2 + .row { border-top: 0; }
.row .label { flex: 1; min-width: 0; }
.row .label small { display: block; color: var(--muted); font-size: 12px; }
.row .ctl { display: flex; align-items: center; gap: 8px; }
.sym { display: inline-block; width: 18px; height: 18px; background: currentColor; -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat; flex: none; }
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 12px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:disabled + span { opacity: .45; cursor: default; }
input[type=text], input[type=number], select, textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; outline: none; }
input[type=text]:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { width: 100%; min-height: 92px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; resize: vertical; }
input[type=range] { width: 220px; accent-color: var(--accent); }
input[type=color] { width: 38px; height: 28px; border: 1px solid var(--line); border-radius: 7px; background: none; padding: 2px; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--red); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { padding: 5px 7px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; background: var(--panel-2); color: var(--muted); }
.pill.green { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.pill.amber { background: color-mix(in srgb, var(--amber) 20%, transparent); color: var(--amber); }
.pill.red { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.pill.blue { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.banner { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; background: color-mix(in srgb, var(--amber) 16%, var(--panel)); border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); }
.banner .label { flex: 1; }
#toast { position: fixed; right: 18px; bottom: 18px; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: .92; }
/* Live */
.mirror { position: relative; border-radius: 12px; overflow: hidden; background: #09090b; aspect-ratio: 4 / 1; cursor: crosshair; }
.mirror img { width: 100%; height: 100%; display: block; image-rendering: auto; }
.mirror .off { position: absolute; inset: 0; display: grid; place-items: center; color: #8c8c96; font-size: 15px; }
.knob { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; }
.pages { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 16px; }
.pages .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; padding: 12px 18px 16px; }
.grid2 .k { color: var(--muted); }
.dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--faint); }
/* Panes / lists */
.list .row .icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-2); flex: none; }
.list .row.off { opacity: .5; }
/* Shortcuts */
.split { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
.tiles .row { cursor: pointer; }
.tiles .row.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.tile { width: 120px; height: 120px; border-radius: 16px; background: #151519; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; color: #e8e8ee; margin: 6px auto 10px; }
.tile .sym { width: 40px; height: 40px; }
.tile span { font-weight: 600; font-size: 13px; text-align: center; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.suggest { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; padding: 4px 18px 14px; }
.suggest button { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.suggest button:hover, .suggest button.on { border-color: var(--accent); color: var(--accent); }
.clip { display: flex; align-items: center; gap: 12px; }
.clip .icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  nav { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); }
  nav .brand, nav .where { width: 100%; }
  main { padding: 18px 16px 48px; }
  .split { grid-template-columns: 1fr; }
  input[type=range] { width: 140px; }
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"><p class="sub">Loading…</p></main>
</div>
<div id="toast"></div>
<script>
"use strict";
const PAGES = [
  ["dash", "Dashboard", "square.grid.2x2.fill", "A tile per pane with its status at a glance"],
  ["ai", "AI", "sparkles", "Claude Code sessions, their steps, who needs you"],
  ["music", "Music", "music.note", "Spotify or Music: now playing, controls, volume"],
  ["shortcuts", "Shortcuts", "square.grid.3x3.fill", "Tiles that type keys, open things, run Shortcuts"],
  ["soundboard", "Sounds", "waveform", "Clips into your call through the virtual mic"],
  ["league", "League", "gamecontroller.fill", "League client: queue, auto-accept, champ select"],
  ["docker", "Docker", "shippingbox.fill", "Containers on Kiri or Docker, with logs"],
  ["ops", "Ops", "server.rack", "WARP, your servers and your sites"],
  ["code", "Code", "arrow.triangle.pull", "GitHub PRs and GitLab merge requests"],
  ["digin", "Digin", "bubble.left.and.text.bubble.right.fill", "Your issues, inbox, chat and pages from Digin"],
  ["calendar", "Calendar", "calendar", "Today's agenda, the next meeting and a join button"],
  ["stocks", "Stocks", "chart.line.uptrend.xyaxis", "Your symbols with today's change and charts"],
  ["focus", "Focus", "timer", "A focus timer on the knob and ring"],
  ["deploy", "Deploy", "paperplane.fill", "Deploy your projects and watch CI"],
  ["paste", "Clipboard", "doc.on.clipboard.fill", "Pick a recent copy and paste it"],
  ["windows", "Windows", "macwindow.on.rectangle", "Switch apps from the knob"],
  ["health", "Health", "waveform.path.ecg", "CPU, memory, GPU and network for your Macs"],
  ["settings", "Settings", "gearshape.fill", "Brightness and switches, right on the board"],
];
const PAGE = Object.fromEntries(PAGES.map(([id, label, sym, blurb]) => [id, { id, label, sym, blurb }]));
const TABS = [
  ["live", "Live", "display"], ["panes", "Panes", "rectangle.3.group"], ["shortcuts", "Shortcuts", "square.grid.3x3"],
  ["soundboard", "Soundboard", "waveform"], ["lighting", "Lighting", "light.max"], ["general", "General", "gearshape"],
  ["digin", "Digin", "bubble.left.and.text.bubble.right"],
  ["extras", "Extras", "sparkles"],
  ["sync", "Macs", "laptopcomputer.and.iphone"],
  ["updates", "Updates", "arrow.down.circle"],
];
const SYMBOLS = ["star.fill", "bolt.fill", "camera.viewfinder", "rectangle.dashed", "lock.fill", "moon.fill", "sun.max.fill", "speaker.slash.fill", "mic.slash.fill", "music.note", "playpause.fill", "forward.fill", "backward.fill", "terminal.fill", "safari.fill", "globe", "folder.fill", "doc.text.fill", "envelope.fill", "message.fill", "phone.fill", "video.fill", "calendar", "clock.fill", "timer", "bell.fill", "gearshape.fill", "hammer.fill", "wrench.and.screwdriver.fill", "sparkles", "brain.head.profile", "chevron.left.forwardslash.chevron.right", "server.rack", "shippingbox.fill", "cloud.fill", "network", "wifi", "lightbulb.fill", "house.fill", "gamecontroller.fill", "headphones", "megaphone.fill", "hand.thumbsup.fill", "heart.fill", "flame.fill", "trash.fill", "arrow.clockwise", "square.and.arrow.up", "rectangle.split.2x1.fill", "macwindow", "display", "keyboard", "command", "eye.fill", "magnifyingglass", "paperplane.fill", "cart.fill", "creditcard.fill", "person.fill", "figure.walk"];
const ACTIONS = [["keys", "Type keys"], ["open", "Open"], ["shortcut", "Run a Shortcut"], ["shell", "Shell command"], ["micMute", "Mute my mic"], ["media", "Music control"], ["clip", "Play a clip"], ["page", "Go to a page"]];

let state = null, cfg = null, tab = localStorage.getItem("quaked.tab") || "live";
let saveTimer = null, saving = false, editing = false, selTile = 0, devices = null, pairing = null;

const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") for (const [p, val] of Object.entries(v)) { if (val == null) continue; if (p.startsWith("--")) el.style.setProperty(p, val); else el.style[p] = val; }
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }

}
const sym = (name, px = 18, color) => h("span", { class: "sym", style: { "--u": `url(/api/symbol?name=${encodeURIComponent(name)}&px=64)`, width: px + "px", height: px + "px", color } });
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }
const get = (path) => path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), cfg);
function set(path, value) {
  const keys = path.split("."); let o = cfg;
  for (const k of keys.slice(0, -1)) { if (o[k] == null) o[k] = {}; o = o[k]; }
  o[keys.at(-1)] = value; changed();
}
function changed() { editing = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
async function save() {
  saving = true;
  try {
    const r = await fetch("/api/config", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cfg) });
    const j = await r.json();
    if (!r.ok) toast("Not saved: " + (j.error || r.status)); else toast("Saved");
  } catch (e) { toast("Not saved: quaked isn't answering"); }
  saving = false; editing = false; poll();
}
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const type = r.headers.get("content-type") || "";
  const body = type.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || r.status);
  return body;
}
const ctl = (line) => api("/api/ctl", { method: "POST", body: line }).catch((e) => toast(String(e.message || e)));
const strip = (c) => { const x = structuredClone(c); delete x.updatedAt; return JSON.stringify(x); };

async function poll() {
  try { state = await api("/api/state"); } catch (e) { $("#main").replaceChildren(h("div", { class: "card" }, h("div", { class: "empty" }, "quaked isn't answering. Is it running? (./install.sh starts it)"))); return; }
  const fresh = !cfg || (!editing && !saving && strip(state.config) !== strip(cfg));
  if (fresh) { cfg = structuredClone(state.config); render(); }
  else { if (cfg && !editing) cfg.updatedAt = state.config.updatedAt; renderNav(); renderLive(); renderBanner(); renderUpdates(); }
}

// ---------------------------------------------------------------- controls
function toggle(label, path, desc, opts = {}) {
  const input = h("input", { type: "checkbox", checked: !!get(path), disabled: opts.disabled, onchange: (e) => { set(path, e.target.checked); opts.after && opts.after(); } });
  return h("div", { class: "row" }, h("div", { class: "label" }, label, desc && h("small", {}, desc)), h("label", { class: "switch" }, input, h("span")));
}
function slider(label, path, min, max, step, fmt, desc) {
  const out = h("span", { class: "mono", style: { minWidth: "56px", textAlign: "right" } }, fmt(get(path) ?? min));
  const input = h("input", { type: "range", min, max, step, value: get(path) ?? min, oninput: (e) => { out.textContent = fmt(+e.target.value); set(path, +e.target.value); } });
  return h("div", { class: "row" }, h("div", { class: "label" }, label, desc && h("small", {}, desc)), h("div", { class: "ctl" }, input, out));
}
function choice(label, path, options, desc, numeric) {
  const cur = get(path);
  const sel = h("select", { onchange: (e) => set(path, numeric ? +e.target.value : e.target.value) },
    options.map(([v, t]) => h("option", { value: v, selected: String(v) === String(cur) }, t)));
  return h("div", { class: "row" }, h("div", { class: "label" }, label, desc && h("small", {}, desc)), sel);
}
function text(label, path, placeholder, desc, width = "260px") {
  return h("div", { class: "row" }, h("div", { class: "label" }, label, desc && h("small", {}, desc)),
    h("input", { type: "text", value: get(path) ?? "", placeholder, style: { width }, oninput: (e) => set(path, e.target.value) }));
}
function color(label, path, desc) {
  return h("div", { class: "row" }, h("div", { class: "label" }, label, desc && h("small", {}, desc)),
    h("div", { class: "ctl" }, h("span", { class: "mono", style: { color: "var(--muted)", fontSize: "12px" } }, get(path) || ""),
      h("input", { type: "color", value: get(path) || "#888888", oninput: (e) => { set(path, e.target.value.toUpperCase()); e.target.previousSibling.textContent = e.target.value.toUpperCase(); } })));
}
function lines(label, path, desc) {
  return h("div", { class: "row", style: { display: "block" } }, h("div", { class: "label", style: { marginBottom: "8px" } }, label, desc && h("small", {}, desc)),
    h("textarea", { oninput: (e) => set(path, e.target.value.split("\n").map((s) => s.trim()).filter(Boolean)) }, (get(path) || []).join("\n")));
}
const card = (title, foot, ...rows) => h("div", { class: "card" }, title && h("h2", {}, title), ...rows, foot && h("div", { class: "foot" }, foot));
const secs = (s) => (s >= 120 ? `${Math.round(s / 60)} min` : `${s} s`);

// ---------------------------------------------------------------- frame
function renderNav() {
  const nav = $("#nav");
  const conn = state?.status?.connected;
  const route = state?.route?.kind;
  const where = route === "local" ? ["The Quake is on", "this Mac"] : route === "remote" ? ["The Quake is on", state.route.name] : ["No Quake connected", "Plug it into either Mac"];
  nav.replaceChildren(
    h("div", { class: "brand" }, h("span", { class: "dot" + (conn ? " on" : "") }), "Quaked"),
    ...TABS.map(([id, label, s]) => h("a", { class: tab === id ? "active" : "", onclick: () => { tab = id; localStorage.setItem("quaked.tab", id); render(); } }, sym(s, 16), label,
      id === "updates" && (state?.status?.features?.update?.macs || []).some((m) => m.state === "behind") ? h("span", { class: "pill blue", style: { marginLeft: "auto" } }, "New") : null)),
    h("div", { class: "where" }, where[0], h("b", {}, where[1]), state?.machine ? h("div", { style: { marginTop: "6px" } }, `You're on ${state.machine}`) : null),
  );
}
function renderBanner() {
  const slot = $("#banner"); if (!slot) return;
  const ask = state?.pairAsk;
  slot.replaceChildren(ask ? h("div", { class: "banner" }, sym("laptopcomputer.and.iphone", 22),
    h("div", { class: "label" }, h("b", {}, `${ask} wants to pair`), h("div", { style: { color: "var(--muted)", fontSize: "12px" } }, "It will share Claude sessions and settings with this Mac. You can also press the knob on the Quake.")),
    h("button", { class: "btn", onclick: () => api("/api/pair-answer?allow=0", { method: "POST" }).then(poll) }, "Refuse"),

}
function render() {
  renderNav();
  const main = $("#main");
  main.replaceChildren(h("div", { id: "banner" }));
  renderBanner();
  const views = { live: viewLive, panes: viewPanes, shortcuts: viewShortcuts, soundboard: viewSoundboard, lighting: viewLighting, general: viewGeneral, digin: viewDigin, extras: viewExtras, sync: viewSync, updates: viewUpdates };
  (views[tab] || viewLive)(main);
}

// ---------------------------------------------------------------- Live
let frameTimer = null;
function viewLive(main) {
  const st = state.status || {};
  main.append(h("h1", {}, "Live"), h("p", { class: "sub" }, "The board as it is now. Click it to tap; the buttons work like the knob."));
  const img = h("img", { id: "frame", alt: "" });
  const mirror = h("div", { class: "mirror", id: "mirror", onclick: (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    ctl(`tap ${Math.round((e.clientX - r.left) / r.width * 1920)} ${Math.round((e.clientY - r.top) / r.height * 480)}`).then(refreshFrame);
  } }, img, h("div", { class: "off", id: "mirror-off", style: { display: "none" } }, "No Quake connected"));
  const k = (label, s, line) => h("button", { class: "btn", onclick: () => ctl(line).then(refreshFrame) }, sym(s, 15), label);
  main.append(card(null, null, h("div", { style: { padding: "14px 14px 0" } }, mirror),
    h("div", { class: "knob" }, k("Turn left", "arrow.counterclockwise", "turn -1"), k("Press", "circle.inset.filled", "press"), k("Turn right", "arrow.clockwise", "turn 1"),
      k("Back", "chevron.left", "double"), k("Top", "house", "hold")),
    h("div", { class: "pages", id: "pagebtns" })));
  main.append(card("Status", null, h("div", { class: "grid2", id: "statusgrid" })));
  renderLive();
  refreshFrame();
  clearInterval(frameTimer);
  frameTimer = setInterval(() => { if (tab === "live" && !document.hidden) refreshFrame(); }, 600);
}
function refreshFrame() {
  const img = $("#frame"); if (!img) return;
  const off = state?.route?.kind === "none";
  $("#mirror-off").style.display = off ? "grid" : "none";
  img.style.visibility = off ? "hidden" : "visible";
  if (off) return;
  const next = new Image();
  next.onload = () => { if ($("#frame")) $("#frame").src = next.src; };
  next.src = "/api/frame?t=" + Date.now();
}
function renderLive() {
  if (tab !== "live" || !$("#statusgrid")) return;
  const st = state.status || {};
  const pages = $("#pagebtns");
  pages.replaceChildren(...(cfg.pages || []).map((p) => h("button", { class: "btn small" + (st.page === p ? " on" : ""), onclick: () => ctl(`page ${p}`).then(refreshFrame) }, sym(PAGE[p]?.sym || "circle", 13), PAGE[p]?.label || p)));
  const dot = (c) => h("span", { class: "dotc", style: { background: c } });
  const sb = st.soundboard || {};

// ---------------------------------------------------------------- Updates
const ago = (ms) => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 48 * 60 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
// Release notes (Markdown) as plain paragraphs and bullets; never as HTML.
function notesView(md) {
  const plain = (s) => s.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/\*\*|__|`/g, "");
  const out = h("div", { style: { padding: "4px 18px 14px", color: "var(--text-2, inherit)", fontSize: "13.5px", lineHeight: "1.5" } });
  let list = null;
  for (const raw of (md || "").split("\n")) {
    const t = raw.trim();
    const item = t.match(/^[-*] (.*)/);
    if (item) { if (!list) out.append(list = h("ul", { style: { margin: "6px 0", paddingLeft: "20px" } })); list.append(h("li", {}, plain(item[1]))); continue; }
    list = null;
    if (t) out.append(h("p", { style: { margin: "6px 0" } }, plain(t.replace(/^#+\s*/, ""))));
  }
  return out;
}

// The Stocks card: your symbols in order (with what each is and its price), search to add.
function stocksCard() {
  const st = cfg.stocks || (cfg.stocks = { enabled: true, symbols: [], refreshSeconds: 60 });
  const symbols = st.symbols || (st.symbols = []);
  const live = Object.fromEntries((state.status?.features?.stocks?.quotes || []).map((q) => [q.symbol, q]));
  const add = (raw) => {
    const s = (raw || "").trim().toUpperCase();
    if (!s || symbols.includes(s)) return;
    symbols.push(s);
    changed();
    render();
  };
  const move = (i, d) => {
    const j = i + d;
    if (j < 0 || j >= symbols.length) return;
    [symbols[i], symbols[j]] = [symbols[j], symbols[i]];
    changed();
    render();
  };
  const results = h("div", { style: { display: "flex", flexWrap: "wrap", gap: "8px", marginTop: "10px" } });
  const input = h("input", { type: "text", placeholder: "Search a company or type a symbol: apple, AAPL, ^GSPC, BTC-USD", style: { width: "420px" } });
  let timer;
  const search = async () => {
    const q = input.value.trim();
    if (!q) return results.replaceChildren();
    const found = await fetch(`/api/stocks-search?q=${encodeURIComponent(q)}`).then((r) => (r.ok ? r.json() : [])).catch(() => []);
    if (input.value.trim() !== q) return;
    results.replaceChildren(...(found.length ? found : [{ symbol: q.toUpperCase(), name: "add as typed" }]).map((x) =>
      h("button", { class: "btn small", onclick: () => add(x.symbol) }, sym("plus", 11), `${x.symbol}`, h("span", { style: { color: "var(--muted)", marginLeft: "6px" } }, [x.name, x.exchange].filter(Boolean).join(" · ")))));
  };
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(search, 300); };
  input.onkeydown = (e) => { if (e.key === "Enter") add(input.value); };
  const row = (s, i) => {
    const q = live[s];
    const what = !q ? "Prices come in on the next refresh" : q.error ? q.error : `${q.name || s}  ·  ${q.price.toLocaleString(undefined, { maximumFractionDigits: 2 })}  ·  ${q.changePct >= 0 ? "+" : ""}${q.changePct.toFixed(2)}%`;
    return h("div", { class: "row" },
      h("div", { class: "label" }, h("b", { class: "mono" }, s), h("small", { style: q?.error ? { color: "var(--amber)" } : {} }, what)),
      h("div", { class: "ctl" },
        h("button", { class: "btn small", disabled: i === 0, onclick: () => move(i, -1) }, "↑"),
        h("button", { class: "btn small", disabled: i === symbols.length - 1, onclick: () => move(i, 1) }, "↓"),
        h("button", { class: "btn small danger", onclick: () => { symbols.splice(i, 1); changed(); render(); } }, "Remove")));
  };
  return card("Stocks", "Prices from Yahoo Finance, delayed up to 15 minutes; no account needed, and only these symbols are sent. Indexes start with ^, crypto ends in -USD.",
    toggle("Stocks page", "stocks.enabled"),
    choice("Refresh every", "stocks.refreshSeconds", [[30, "30 s"], [60, "1 min"], [120, "2 min"], [300, "5 min"]], "While the Stocks page is on screen; every 15 minutes otherwise", true),
    ...symbols.map(row),
    h("div", { class: "row", style: { display: "block" } }, h("div", { style: { display: "flex", gap: "8px" } }, input, h("button", { class: "btn small primary", onclick: () => add(input.value) }, sym("plus", 12), "Add")), results));
}
async function pairWith(name) {

  try { await api(`/api/pair?peer=${encodeURIComponent(name)}`, { method: "POST" }); toast(`Paired with ${name}`); }
  catch (e) { toast(`Not paired: ${e.message || e}`); }
  pairing = null; cfg = null; poll();
}
